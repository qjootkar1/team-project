<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>업로드 데이터 조회</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">A</span> ACCOUNTSCOPE</div><div class="nav-label">MY WORKSPACE</div><nav class="nav"><a href="index.html">▦　업무 개요</a><a href="upload.html">⇧　분개장 업로드</a><a class="active" href="data.html">▤　업로드 데이터 조회</a><a href="years.html">◷　연도별 데이터 관리</a></nav><div class="side-note">업로드된 분개 데이터를 검색하고 거래 단위로 확인할 수 있습니다.</div></aside><main class="main"><div class="top"><div><div class="crumb">DATA MANAGEMENT / RECORDS</div><div class="page-title">업로드 데이터 조회</div><div class="subtitle">등록된 분개장 거래를 검색하고 상세 내역을 확인합니다.</div></div><div class="user"><span class="avatar">김</span> FUN-02</div></div><div class="grid three"><div class="stat"><div class="stat-label">조회 거래 건수</div><div class="stat-value" id="count">0</div></div><div class="stat"><div class="stat-label">차변 합계</div><div class="stat-value" id="debit">0원</div></div><div class="stat"><div class="stat-label">대변 합계</div><div class="stat-value" id="credit">0원</div></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">검색 조건</div><div class="muted small">파일, 연도, 계정과목, 거래처 및 적요로 검색할 수 있습니다.</div></div><button class="btn" id="clear">조건 초기화</button></div><div class="row"><div class="field" style="flex:1"><label>통합 검색</label><input id="q" placeholder="계정과목, 거래처, 적요, 전표번호"></div><div class="field"><label>연도</label><select id="year"><option value="">전체 연도</option></select></div><div class="field"><label>데이터 파일</label><select id="dataset"><option value="">전체 파일</option></select></div><div class="field"><label>계정과목</label><input id="account" placeholder="계정과목명"></div><button class="btn primary" id="search">조회</button></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">거래 내역</div><div class="muted small" id="resultText">전체 데이터</div></div><button class="btn" id="export">현재 결과 CSV 다운로드</button></div><div id="table"></div></div></main></div><script src="common.js"></script><script>const $=id=>document.getElementById(id);function init(){const params=new URLSearchParams(location.search);if(params.get('year'))$('year').dataset.initial=params.get('year');const rows=allRows(),years=[...new Set(rows.map(yearOf).filter(Boolean))].sort((a,b)=>b-a);$('year').innerHTML='<option value="">전체 연도</option>'+years.map(y=>`<option>${y}</option>`).join('');$('dataset').innerHTML='<option value="">전체 파일</option>'+loadStore().datasets.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join('');if($('year').dataset.initial)$('year').value=$('year').dataset.initial;render()}function filtered(){const q=$('q').value.toLowerCase(),y=$('year').value,ds=$('dataset').value,a=$('account').value.toLowerCase();return allRows().filter(r=>(!q||[r.accountCode,r.accountName,r.description,r.customer,r.voucherNo].join(' ').toLowerCase().includes(q))&&(!y||String(yearOf(r))===y)&&(!ds||r.datasetId===ds)&&(!a||r.accountName.toLowerCase().includes(a)||r.accountCode.includes(a)))}function render(){const rows=filtered();$('count').textContent=rows.length.toLocaleString();$('debit').textContent=money(rows.reduce((s,r)=>s+r.debit,0));$('credit').textContent=money(rows.reduce((s,r)=>s+r.credit,0));$('resultText').textContent=`검색 결과 ${rows.length.toLocaleString()}건`;if(!rows.length){$('table').innerHTML='<div class="empty"><strong>조회된 데이터가 없습니다.</strong>분개장 파일을 업로드하거나 검색 조건을 변경하세요.<br><br><a class="btn primary" href="upload.html">파일 업로드</a></div>';return}$('table').innerHTML='<div class="table-wrap"><table><thead><tr><th>거래일자</th><th>전표번호</th><th>계정코드</th><th>계정과목</th><th>거래처</th><th>적요</th><th class="right">차변</th><th class="right">대변</th><th>원본 파일</th></tr></thead><tbody>'+rows.slice(0,500).map(r=>`<tr><td>${esc(r.date||'-')}</td><td>${esc(r.voucherNo||'-')}</td><td>${esc(r.accountCode||'-')}</td><td>${esc(r.accountName||'-')}</td><td>${esc(r.customer||'-')}</td><td>${esc(r.description||'-')}</td><td class="right">${r.debit?money(r.debit):'-'}</td><td class="right">${r.credit?money(r.credit):'-'}</td><td>${esc(r.datasetName)}</td></tr>`).join('')+'</tbody></table></div>'+(rows.length>500?'<p class="muted small">화면에는 처음 500건만 표시합니다. CSV 내보내기에는 검색 결과 전체가 포함됩니다.</p>':'')};$('search').onclick=render;['q','account'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')render()}));['year','dataset'].forEach(id=>$(id).onchange=render);$('clear').onclick=()=>{$('q').value='';$('year').value='';$('dataset').value='';$('account').value='';render()};$('export').onclick=()=>{const rows=filtered(),cols=['date','voucherNo','accountCode','accountName','customer','description','debit','credit','datasetName'];const csv=[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');download('분개장_조회결과.csv','\ufeff'+csv,'text/csv;charset=utf-8')};init();</script></body></html>
